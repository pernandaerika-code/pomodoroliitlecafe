<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges" width="64" height="64">
  <!-- Dark Espresso Background -->
  <rect width="64" height="64" fill="#18110D" rx="12" />
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#3C2B22" stroke-width="2" rx="10" />

  <!-- Steam -->
  <rect x="24" y="10" width="3" height="6" fill="#F5EBE1" opacity="0.6" />
  <rect x="27" y="8" width="3" height="4" fill="#F5EBE1" opacity="0.4" />
  <rect x="36" y="12" width="3" height="6" fill="#F5EBE1" opacity="0.6" />
  <rect x="39" y="10" width="3" height="4" fill="#F5EBE1" opacity="0.4" />

  <!-- Mug Body -->
  <rect x="16" y="20" width="30" height="30" fill="#E8DCCB" />
  <rect x="18" y="48" width="26" height="4" fill="#C9B8A3" />
  <rect x="19" y="23" width="24" height="23" fill="#6E3B1E" />
  <rect x="19" y="23" width="24" height="7" fill="#E08A3C" opacity="0.9" />

  <!-- Foam / Latte Art Heart -->
  <rect x="27" y="25" width="4" height="4" fill="#FFFDF9" />
  <rect x="33" y="25" width="4" height="4" fill="#FFFDF9" />
  <rect x="29" y="29" width="6" height="3" fill="#FFFDF9" />
  <rect x="31" y="32" width="2" height="2" fill="#FFFDF9" />

  <!-- Handle -->
  <rect x="46" y="24" width="7" height="4" fill="#E8DCCB" />
  <rect x="49" y="28" width="4" height="12" fill="#E8DCCB" />
  <rect x="46" y="38" width="7" height="4" fill="#C9B8A3" />
</svg>
